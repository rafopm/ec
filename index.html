<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitio en Construcción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #5a3a1e, #d8c3a5);
      color: #4a2e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255, 248, 240, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(90,58,30,0.25);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .socials {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 500;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: #fff;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .facebook {
      background: #8d5524;
    }

    .whatsapp {
      background: #d87c2a;
    }

    .instagram {
      background: linear-gradient(45deg, #c97c2d, #e09f3e);
    }

    footer {
      margin-top: 25px;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚧 Sitio en construcción</h1>
    <p>Estamos trabajando para ofrecerte una mejor experiencia.<br />Muy pronto estaremos en línea.</p>

    <div class="socials">
      <!-- Reemplaza los enlaces con los tuyos -->
      <a href="https://www.facebook.com/colegiosanmartindeporressantaanita" target="_blank" class="btn facebook">Facebook</a>
      <a href="https://www.instagram.com/colegiosanmartin.santaanita" target="_blank" class="btn instagram">Instagram</a>
      <a href="https://wa.me/51997786689" target="_blank" class="btn whatsapp">WhatsApp</a>
    </div>

    <footer>
      © 2026 · Todos los derechos reservados
    </footer>
  </div>
</body>
</html>
